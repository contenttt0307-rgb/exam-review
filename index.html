<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>段考複習系統</title>
<meta name="description" content="高一數學第一次段考複習：60 秒健檢、觀念刷題與錯題攻克。">
<meta name="theme-color" content="#13294B">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Sora:wght@500;600;700&display=swap">
<style>
/* Layout: one phone-width column, one task per screen; navy ink + chalk-yellow highlight taken from the app icon */
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --ink:#13294B; --muted:#5D6880; --line:#DDE3EC;
  --accent:#F5B82E; --accent-soft:#FDF1D3;
  --btn-bg:#13294B; --btn-fg:#FFFFFF;
  --good:#1E8556; --good-soft:#E3F3EA; --bad:#C2453A; --bad-soft:#FBE8E6;
  --chip:#EBEFF5;
  --f-body:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  --f-num:"Sora","Noto Sans TC",system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1422; --surface:#162034; --ink:#E7ECF5; --muted:#9AA6BD; --line:#26324A;
  --accent:#F5C04A; --accent-soft:#3A3220;
  --btn-bg:#F5C04A; --btn-fg:#13294B;
  --good:#4CC28A; --good-soft:#163A2B; --bad:#F07A6E; --bad-soft:#3E1F1E;
  --chip:#1F2B42; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1422; --surface:#162034; --ink:#E7ECF5; --muted:#9AA6BD; --line:#26324A;
  --accent:#F5C04A; --accent-soft:#3A3220;
  --btn-bg:#F5C04A; --btn-fg:#13294B;
  --good:#4CC28A; --good-soft:#163A2B; --bad:#F07A6E; --bad-soft:#3E1F1E;
  --chip:#1F2B42; color-scheme:dark}
html,body{height:100%;margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:440px;margin:0 auto;padding-inline:20px;padding-block:16px 32px;min-height:100%;display:flex;flex-direction:column;gap:20px}
.proto{align-self:center;font-size:12px;letter-spacing:.06em;color:var(--muted);background:var(--chip);padding:2px 10px;border-radius:99px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
h1,h2{margin:0;text-wrap:balance;line-height:1.3}
h1{font-size:28px;font-weight:700}
h2{font-size:20px;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:var(--r);background:var(--btn-bg);color:var(--btn-fg);font-weight:700;font-size:17px;transition:transform .12s,opacity .2s}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.35;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.link{color:var(--muted);font-size:14px;text-decoration:underline;text-underline-offset:3px;align-self:center;padding:6px}
.stack{display:flex;flex-direction:column;gap:12px}
.grow{flex:1}
/* welcome */
.hero{display:flex;flex-direction:column;align-items:flex-start;gap:16px;padding-top:24px}
.hero img{width:96px;height:96px;border-radius:24px;background:var(--surface);padding:8px;box-shadow:0 6px 24px rgba(19,41,75,.08)}
.eyebrow{font-size:13px;letter-spacing:.08em;color:var(--muted);font-weight:500}
.hl{background:linear-gradient(transparent 62%,var(--accent-soft) 62%)}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fact{background:var(--surface);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:2px}
.fact b{font-family:var(--f-num);font-size:22px}
.fact span{font-size:13px;color:var(--muted)}
/* quiz */
.top{display:flex;align-items:center;gap:12px}
.bar{flex:1;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);border-radius:99px;transition:width .3s}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;background:var(--chip);color:var(--muted);padding:3px 10px;border-radius:99px;white-space:nowrap}
.chip.supp{background:var(--accent-soft);color:var(--ink)}
.stem{font-size:21px;font-weight:500;line-height:1.7}
.stem .k{font-size:14px;color:var(--muted);display:block;margin-bottom:4px;font-weight:400}
.rt{white-space:nowrap}
.rt>span{border-top:1.6px solid currentColor;padding:0 2px;margin-left:1px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:14px 16px;min-height:56px;font-size:18px;transition:border-color .15s,background .15s}
.opt .mk{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:14px;font-family:var(--f-num);color:var(--muted)}
.opts.multi .opt .mk{border-radius:8px}
.opt.sel{border-color:var(--ink)}
.opt.sel .mk{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .mk{background:var(--good);border-color:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .mk{background:var(--bad);border-color:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.tfrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tfrow .opt{justify-content:center;font-size:20px;min-height:72px}
.conf{display:flex;flex-direction:column;gap:8px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--chip);border-radius:12px;padding:4px;gap:4px}
.seg button{border-radius:9px;padding:8px 4px;font-size:15px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.dock{position:sticky;bottom:0;padding-top:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 30%)}
/* keypad */
.numbox{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1.5px solid var(--ink);border-radius:var(--r);padding:12px 16px;font-size:28px;min-height:64px}
.numbox .unit{font-size:16px;color:var(--muted)}
.numbox.right{border-color:var(--good);background:var(--good-soft)}
.numbox.wrong{border-color:var(--bad);background:var(--bad-soft)}
.caret{display:inline-block;width:2px;height:28px;background:var(--ink);vertical-align:middle;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keys button{background:var(--surface);border-radius:12px;min-height:52px;font-family:var(--f-num);font-size:22px}
.keys button:active{background:var(--chip)}
/* feedback */
.fb{border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;animation:rise .25s ease-out}
.fb.ok{background:var(--good-soft)}
.fb.no{background:var(--bad-soft)}
.fb h2{display:flex;align-items:center;gap:8px}
.fb.ok h2{color:var(--good)}
.fb.no h2{color:var(--bad)}
.peers{font-size:14px;color:var(--ink);display:flex;align-items:center;gap:8px}
.peers .dots{display:flex}
.peers .dots i{width:18px;height:18px;border-radius:50%;background:var(--muted);opacity:.35;border:2px solid var(--surface);margin-left:-6px}
.peers .dots i:first-child{margin-left:0}
.why{display:flex;flex-direction:column;gap:8px}
.why button{text-align:left;background:var(--surface);border:1.5px solid transparent;border-radius:12px;padding:10px 14px;font-size:15px}
.why button.pick{border-color:var(--ink)}
.why button.key{border-color:var(--good)}
.exp{background:var(--surface);border-radius:12px;padding:14px;font-size:15px;line-height:1.75;display:flex;flex-direction:column;gap:6px}
.exp b{font-size:13px;letter-spacing:.06em;color:var(--muted);font-weight:500}
.fast{border-top:1px dashed var(--line);padding-top:8px;margin-top:4px}
.share{display:flex;align-items:center;justify-content:center;gap:6px;font-size:15px;color:var(--ink);padding:8px;border-radius:10px}
@keyframes rise{from{transform:translateY(8px);opacity:.4}to{transform:none;opacity:1}}
/* result */
.score{display:flex;align-items:center;gap:20px;background:var(--surface);border-radius:20px;padding:20px}
.ring{position:relative;width:120px;height:120px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.1}
.ring .v b{font-family:var(--f-num);font-size:34px}
.ring .v b small{font-size:16px}
.ring .v span{font-size:12px;color:var(--muted)}
.units{display:flex;flex-direction:column;gap:10px}
.urow{display:grid;grid-template-columns:96px 1fr 40px;align-items:center;gap:10px;font-size:14px}
.urow .bar{height:8px}
.urow .bar i{background:var(--accent)}
.urow .num{text-align:right;color:var(--muted)}
.card{background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.todo{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.todo li{display:flex;align-items:center;gap:10px;font-size:15px}
.todo li::before{content:"";width:10px;height:10px;border-radius:3px;border:2px solid var(--bad);flex:none}
.note{font-size:14px;background:var(--accent-soft);border-radius:12px;padding:10px 14px}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:52px;border-radius:var(--r);background:var(--surface);border:1.5px solid var(--line);font-weight:500;font-size:16px}
.gbtn svg{width:20px;height:20px}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(8,14,26,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10;animation:fade .2s}
.sheet{background:var(--bg);width:100%;max-width:440px;border-radius:22px 22px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px;animation:up .25s ease-out}
.grab{width:40px;height:4px;border-radius:9px;background:var(--line);align-self:center}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px)}}
.acct{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:var(--r);padding:12px 14px;text-align:left;width:100%;border:1.5px solid var(--line)}
.av{width:40px;height:40px;border-radius:50%;background:var(--ink);color:var(--surface);display:grid;place-items:center;font-weight:700;flex:none}
.sharecard{border-radius:18px;padding:20px;background:var(--ink);color:var(--bg);display:flex;flex-direction:column;gap:12px}
.sharecard .big{font-family:var(--f-num);font-size:44px;font-weight:700;color:var(--accent);line-height:1}
.sharecard .q{background:rgba(255,255,255,.08);border-radius:12px;padding:12px;font-size:17px}
/* home */
.hello{display:flex;align-items:center;gap:12px}
.hello .grow p:first-child{font-size:14px;color:var(--muted)}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mode{background:var(--surface);border-radius:var(--r);padding:14px 10px;display:flex;flex-direction:column;gap:6px;text-align:left;border:1.5px solid transparent;min-width:0}
.mode b{font-size:15px}
.mode span{font-size:12px;color:var(--muted);line-height:1.4}
.mode.main{border-color:var(--ink)}
.mode .ic{width:28px;height:28px;border-radius:8px;background:var(--accent-soft);display:grid;place-items:center;font-family:var(--f-num);font-weight:700;font-size:14px}
.goal .bar{height:10px}
.goal .bar i{background:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:14px;z-index:20;max-width:calc(100% - 32px);text-align:center;animation:rise .2s}
mjx-container{font-size:108%!important}
.opt mjx-container,.tfrow mjx-container{margin:0!important}
.stem mjx-container{font-size:112%!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
window.MathJax = {
  tex: { inlineMath: [["\\(", "\\)"]] },
  svg: { fontCache: "global" },
  options: { enableMenu: false },
  startup: { typeset: false, ready() { MathJax.startup.defaultReady(); if (typeof render === "function") render(); } }
};
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-svg.js" async></script>
<script src="questions.js"></script>
<script>
const ICON = "icon-192.png";
const Q = window.QUESTIONS;
const UNITS = [["01","實數"],["02","絕對值"],["03","指數"],["04","科學記號"]];

let S = {screen:"welcome", i:0, sel:[], typed:"", done:false, why:null, log:[], user:null, sheet:null};
const app = document.getElementById("app");
const set = p => { Object.assign(S, p); render(); };

function isRight(q){
  if(q.type==="num") return S.typed===q.ans;
  return [...S.sel].sort().join()===[...q.ans].sort().join();
}
const readiness = () => Math.round(S.log.filter(l=>l.right).length/Q.length*100);
const proto = () => `<span class="proto">原型示意　題目與數據皆為範例</span>`;

function vWelcome(){
  return `${proto()}
  <div class="hero">
    <img src="${ICON}" alt="">
    <span class="eyebrow">高一數學・第一次段考　單元 01–04</span>
    <h1>先花 <span class="hl num">60</span> 秒，<br>看看你準備到哪裡</h1>
    <p class="muted">6 題快速健檢，不用登入。做完馬上告訴你最該補的觀念。</p>
  </div>
  <div class="facts">
    <div class="fact"><b>6</b><span>題</span></div>
    <div class="fact"><b>4</b><span>個單元</span></div>
    <div class="fact"><b>60</b><span>秒完成</span></div>
  </div>
  <div class="grow"></div>
  <div class="stack">
    <button class="btn" data-a="start">開始健檢</button>
    <button class="link" data-a="loginsheet">已經用過？用學校 Google 帳號登入</button>
  </div>`;
}

function optHTML(q,k,txt){
  let c="opt";
  if(S.done){ if(q.ans.includes(k)) c+=" right"; else if(S.sel.includes(k)) c+=" wrong"; }
  else if(S.sel.includes(k)) c+=" sel";
  const mk = q.type==="tf" ? "" : `<span class="mk">${q.type==="multi" && S.sel.includes(k) && !S.done ? "✓" : "ABCDE"[k]}</span>`;
  return `<button class="${c}" data-a="pick" data-k="${k}" ${S.done?"disabled":""}>${mk}<span>${txt}</span></button>`;
}

function vQuiz(){
  const q=Q[S.i], right=S.done && isRight(q);
  let body="";
  if(q.type==="tf") body=`<div class="tfrow">${q.opts.map((t,k)=>optHTML(q,k,t)).join("")}</div>`;
  else if(q.type==="num"){
    const cls=S.done?(right?" right":" wrong"):"";
    body=`<div class="numbox${cls}"><span class="num">${S.typed}${S.done?"":'<span class="caret"></span>'}</span><span class="unit">${q.unitWord}</span></div>
    ${S.done?"":`<div class="keys">${["1","2","3","4","5","6","7","8","9",".","0","⌫"].map(x=>`<button data-a="key" data-k="${x}" aria-label="${x==="⌫"?"刪除":x}">${x}</button>`).join("")}</div>`}`;
  }
  else body=`<div class="opts ${q.type==="multi"?"multi":""}">${q.opts.map((t,k)=>optHTML(q,k,t)).join("")}</div>`;

  const answered = q.type==="num" ? S.typed.length>0 : S.sel.length>0;
  let fb="";
  if(S.done){
    const peers=`<div class="peers"><span class="dots"><i></i><i></i><i></i></span>全班有 <b class="num">${q.stuck}%</b> 的人也在這題卡過</div>`;
    const why = right ? "" : `<div class="why"><span class="small">你覺得錯在哪？</span>
      ${q.reasons.map((r,k)=>{let c=""; if(S.why!==null){ if(k===q.key) c="key"; else if(k===S.why) c="pick";} return `<button class="${c}" data-a="why" data-k="${k}" ${S.why!==null?"disabled":""}>${r}</button>`}).join("")}</div>`;
    const showExp = right || S.why!==null;
    const whyMsg = (!right && S.why!==null) ? `<p class="small">${S.why===q.key?"對，關鍵就在這裡。":"最常見的卡點其實是：「"+q.reasons[q.key]+"」。"}</p>`:"";
    fb=`<div class="fb ${right?"ok":"no"}">
      <h2>${right?"答對了":"這題你還沒掌握"}</h2>
      ${right?`<p class="small">這個觀念先記一個「穩」，之後會再出現一次幫你確認。</p>`:peers}
      ${why}${whyMsg}
      ${showExp?`<div class="exp"><b>解析</b><div>${q.exp}</div>${q.fast?`<div class="fast">${q.fast}</div>`:""}</div>`:""}
      ${showExp?`<button class="share" data-a="sharesheet">↗ 丟給同學挑戰這題</button>`:""}
    </div>`;
  }
  const canNext = S.done && (right || S.why!==null);
  return `
  <div class="top"><button aria-label="離開" data-a="home" style="font-size:22px;line-height:1">×</button>
    <div class="bar"><i style="width:${(S.i+(S.done?1:0))/Q.length*100}%"></i></div>
    <span class="num small muted">${S.i+1}/${Q.length}</span></div>
  <div class="stack" style="gap:8px"><div style="display:flex;gap:6px;flex-wrap:wrap"><span class="chip">單元${q.unit} ${q.unitName}</span><span class="chip">${q.tag}</span></div>
  <div class="stem">${q.stem}</div></div>
  ${body}
  ${fb}
  <div class="grow"></div>
  <div class="dock">${S.done
    ? `<button class="btn" data-a="next" ${canNext?"":"disabled"}>${S.i===Q.length-1?"看結果":"下一題"}</button>`
    : `<button class="btn" data-a="submit" ${answered?"":"disabled"}>送出</button>`}</div>`;
}

function ring(p){
  const C=2*Math.PI*52;
  return `<div class="ring"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="none" stroke="var(--line)" stroke-width="10"/>
  <circle cx="60" cy="60" r="52" fill="none" stroke="var(--accent)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C*p/100} ${C}"/></svg>
  <div class="v"><div><b>${p}<small>%</small></b><br><span>段考準備度</span></div></div></div>`;
}
function unitRows(){
  return UNITS.map(([u,n])=>{const ls=S.log.filter(l=>Q[l.i].unit===u), r=ls.filter(l=>l.right).length;
    return `<div class="urow"><span>${u} ${n}</span><div class="bar"><i style="width:${ls.length?r/ls.length*100:0}%"></i></div><span class="num">${r}/${ls.length}</span></div>`}).join("");
}
const weak = () => S.log.filter(l=>!l.right).map(l=>Q[l.i].tag);

function vResult(){
  const p=readiness(), w=weak();
  return `${proto()}
  <h1>你的健檢結果</h1>
  <div class="score">${ring(p)}<div class="units grow" style="min-width:0">${unitRows()}</div></div>
  <div class="card"><h2>最該先補的觀念</h2>
    ${w.length?`<ul class="todo">${w.map(t=>`<li>${t}</li>`).join("")}</ul>`:`<p class="muted">這 6 題全對！登入後可以挑戰更多題目。</p>`}
  </div>
  <div class="grow"></div>
  <div class="stack">
    ${S.user?`<button class="btn" data-a="home">回到首頁</button>`:`<p class="small muted">登入後會保存結果，並幫你排好複習路線。</p>
    <button class="gbtn" data-a="loginsheet">${gIcon()}使用學校 Google 帳號登入</button>`}
  </div>`;
}
function gIcon(){return `<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.6 12.2c0-.8-.1-1.5-.2-2.2H12v4.2h6c-.3 1.4-1 2.5-2.2 3.3v2.7h3.5c2.1-1.9 3.3-4.7 3.3-8z"/><path fill="#34A853" d="M12 23c3 0 5.5-1 7.3-2.7l-3.5-2.7c-1 .7-2.3 1.1-3.8 1.1-2.9 0-5.4-2-6.3-4.6H2.1v2.8C3.9 20.5 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.7 14.1c-.2-.7-.4-1.4-.4-2.1s.1-1.4.4-2.1V7.1H2.1C1.4 8.6 1 10.2 1 12s.4 3.4 1.1 4.9l3.6-2.8z"/><path fill="#EA4335" d="M12 5.4c1.6 0 3.1.6 4.2 1.7l3.2-3.2C17.5 2.1 15 1 12 1 7.7 1 3.9 3.5 2.1 7.1l3.6 2.8c.9-2.6 3.4-4.5 6.3-4.5z"/></svg>`}

function vHome(){
  const p=S.log.length?readiness():0, w=weak();
  const todo = w.length?w:["R13　根式化簡與四則運算",String.raw`A08　\(|x-a|\ge k\)`,"E07　指數比大小"];
  const won=S.log.filter(l=>l.right).length;
  return `${proto()}
  <div class="hello"><div class="av">示</div><div class="grow"><p>114 班・示範同學</p><p style="font-weight:700">今天想怎麼複習？</p></div></div>
  <div class="score">${ring(p)}<div class="grow stack" style="gap:6px;min-width:0"><b>已攻克 <span class="num">${won}</span> 個觀念</b><span class="small muted">還有 <span class="num">${todo.length}</span> 個待攻克。同一個觀念連續答對 2 次就攻克。</span></div></div>
  <div class="modes">
    <button class="mode main" data-a="restart"><span class="ic">5</span><b>5 分鐘快刷</b><span>混合各單元</span></button>
    <button class="mode" data-a="toast" data-k="攻弱點：會優先出你待攻克的觀念"><span class="ic">!</span><b>攻弱點</b><span>只練待攻克</span></button>
    <button class="mode" data-a="toast" data-k="挑戰難題：段考壓軸等級的題目"><span class="ic">↑</span><b>挑戰難題</b><span>拉高難度</span></button>
  </div>
  <div class="card"><h2>待攻克</h2><ul class="todo">${todo.map(t=>`<li>${t}</li>`).join("")}</ul></div>
  <div class="card goal"><div style="display:flex;justify-content:space-between;align-items:baseline"><b>全班共同目標</b><span class="num small muted">412 / 1000</span></div>
    <div class="bar"><i style="width:41.2%"></i></div><p class="small muted">段考前全班一起攻克 1000 個觀念。你貢獻了 <span class="num">${won}</span> 個。</p></div>`;
}

function vSheet(){
  if(S.sheet==="login") return `<div class="scrim" data-a="close"><div class="sheet" role="dialog" aria-label="選擇帳號">
    <span class="grab"></span>
    <div style="display:flex;align-items:center;gap:10px">${gIcon()}<b>選擇帳號以繼續使用「段考複習系統」</b></div>
    <button class="acct" data-a="login"><span class="av">示</span><span class="grow" style="min-width:0"><b>示範同學</b><br><span class="small muted">11530000@sssh.tp.edu.tw</span></span></button>
    <p class="small muted">只接受 sssh.tp.edu.tw 的學校帳號。登入後依學號自動對應班級。</p>
  </div></div>`;
  if(S.sheet==="share"){ const q=Q[S.i];
    return `<div class="scrim" data-a="close"><div class="sheet" role="dialog" aria-label="分享挑戰題">
    <span class="grab"></span>
    <div class="sharecard"><span class="small" style="opacity:.75">段考複習系統・挑戰題</span>
      <div><span class="big">${100-q.stuck}%</span><p>全班只有這麼多人一次答對，你敢試嗎？</p></div>
      <div class="q">${q.stem}</div>
      <span class="small" style="opacity:.75">點開就能作答，不用登入</span></div>
    <p class="small muted">分享內容只有題目，不會出現你的名字或分數。</p>
    <button class="btn" data-a="copy">複製挑戰連結</button>
    <button class="btn ghost" data-a="closebtn">關閉</button>
  </div></div>`;}
  return "";
}

function render(){
  const v = {welcome:vWelcome, quiz:vQuiz, result:vResult, home:vHome}[S.screen]();
  app.innerHTML = v + vSheet();
  if(window.MathJax && MathJax.typesetPromise){
    try{ MathJax.typesetClear && MathJax.typesetClear([app]); }catch(_){}
    MathJax.typesetPromise([app]).catch(()=>{});
  }
}
function toast(t){ const d=document.createElement("div"); d.className="toast"; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),2200); }

app.addEventListener("click", e=>{
  const b=e.target.closest("[data-a]"); if(!b) return;
  const a=b.dataset.a, k=b.dataset.k;
  if(a==="close" && e.target!==b) return;
  const q=Q[S.i];
  switch(a){
    case "start": case "restart": window.scrollTo(0,0); set({screen:"quiz",i:0,sel:[],typed:"",done:false,why:null,log:[]}); break;
    case "pick": { const n=+k;
      if(q.type==="multi") set({sel:S.sel.includes(n)?S.sel.filter(x=>x!==n):[...S.sel,n]}); else set({sel:[n]}); break; }
    case "key": { let t=S.typed; if(k==="⌫") t=t.slice(0,-1); else if(t.length<4) t+=k; set({typed:t}); break; }
    case "submit": S.log.push({i:S.i,right:isRight(q)}); set({done:true}); break;
    case "why": set({why:+k}); break;
    case "next": window.scrollTo(0,0);
      if(S.i===Q.length-1) set({screen:"result"}); else set({i:S.i+1,sel:[],typed:"",done:false,why:null}); break;
    case "home": set({screen:S.user?"home":"welcome",sheet:null}); break;
    case "loginsheet": set({sheet:"login"}); break;
    case "sharesheet": set({sheet:"share"}); break;
    case "close": case "closebtn": set({sheet:null}); break;
    case "login": set({user:"demo",sheet:null,screen:"home"}); toast("已登入，健檢結果已保存"); break;
    case "copy": try{navigator.clipboard.writeText("段考複習系統挑戰題（原型示意連結）").catch(()=>{});}catch(_){}
      set({sheet:null}); toast("已複製挑戰連結（原型示意）"); break;
    case "toast": toast(k+"（原型示意）"); break;
  }
});
render();
</script>
</body>
</html>
